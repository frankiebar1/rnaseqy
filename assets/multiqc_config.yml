report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnaseqy/tree/dev" target="_blank">nf-core/rnaseqy</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/rnaseqy/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "MERGY PCA Plot":
    order: -989
  "MERGY Merged Counts":
    order: -999
  "nf-core-rnaseqy-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-rnaseqy-summary":
    order: -1002

export_plots: true

disable_version_detection: true

ignore_images: false

run_modules:
  - star
  - fastqc
  - custom_content

custom_content:
  mergy_pca:
    section_name: "MERGY PCA Plot"
    description: "PCA plot of merged gene abundance data."
    file_format: "image"
    plot_filename: "MERGY_PCA_Plot_mqc.png"

module_order:
  - fastqc
  - star
  - custom_content